  results: null,      // array of doc results from API

  selectedCaseId: null, // case chosen in upload flow
  activeCase: null,   // case the user is currently working inside

/* ─────────────────────────────────────────────
   ROUTER
───────────────────────────────────────────── */
const PROTECTED = ['dashboard','upload','processing','results','profile','cases','caseDetail'];

function go(page, data={}) {
  if (PROTECTED.includes(page) && !state.user) {
    state.page = 'login';
    render();
    return;
  }
  Object.assign(state, data);
  state.page = page;
  render();
  if (page === 'dashboard')  loadDashboardData();
  if (page === 'profile')    loadProfileData();
  if (page === 'cases')      loadCasesData();
  if (page === 'upload') {
    if (state.activeCase) state.selectedCaseId = String(state.activeCase.id);
    loadCasesData();
  }
  if (page === 'caseDetail') loadCaseDetail(state.currentCase?.case?.id);
}

function fmtSize(b) {
  if (b < 1024) return b+'B';
  if (b < 1048576) return (b/1024).toFixed(1)+'KB';
  return (b/1048576).toFixed(1)+'MB';
}
function badge(type) {
  const map = {
    done:    'bg-emerald-100 text-emerald-700',
    review:  'bg-amber-100   text-amber-700',
    error:   'bg-red-100     text-red-700',
    pending: 'bg-gray-100    text-gray-600',
  };
  const labels = { done:'✓ Done', review:'⚠ Review', error:'✗ Error', pending:'— Pending' };
  return `<span class="px-3 py-1 rounded-full text-xs font-semibold ${map[type]||map.pending}">${labels[type]||type}</span>`;
}
function initials(name) {
  return name.split(' ').slice(0,2).map(n=>n[0]).join('');
}

function scrollTo(id) {
  setTimeout(() => {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior:'smooth', block:'start' });
  }, 50);
}

function toggleFaq(i) {
  const body  = document.getElementById(`faqBody_${i}`);
  const arrow = document.getElementById(`faqArrow_${i}`);
  const open  = !body.classList.contains('hidden');
  body.classList.toggle('hidden', open);
  arrow.style.transform = open ? '' : 'rotate(180deg)';
}

      ${navLink('cases',     'Cases',     'M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z')}

/* Returns a Promise that resolves when the animation finishes. */
function startProcessing() {
  stepsDone = 0;
  const total    = processingSteps.length;
  const interval = 600;

  return new Promise(resolve => {
    function tick() {
      if (stepsDone >= total) { setTimeout(resolve, 400); return; }

      const icon = document.getElementById(`stepIcon_${stepsDone}`);
      const text = document.getElementById(`stepText_${stepsDone}`);
      const bar  = document.getElementById('progBar');

      if (icon) icon.className = 'w-7 h-7 rounded-full flex items-center justify-center flex-shrink-0 step-icon-active transition-all';
      if (text) text.className = 'text-sm text-indigo-700 font-medium';

      setTimeout(() => {
        if (icon) {
          icon.className = 'w-7 h-7 rounded-full flex items-center justify-center flex-shrink-0 step-icon-done transition-all';
          icon.innerHTML = `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>`;
        }
        stepsDone++;
        if (bar) bar.style.width = Math.round((stepsDone / total) * 100) + '%';
        tick();
      }, interval);
    }
    setTimeout(tick, 400);
  });
}

/* Called when user clicks Process. Runs animation + API call in parallel. */
async function processFiles() {
  state.processingError = null;
  state.page = 'processing';
  render();

  const animDone = startProcessing();

  const formData = new FormData();
  state.files.forEach(f => formData.append('files', f));

  try {
    const [apiData] = await Promise.all([
      authFetch(`${API_BASE}/api/documents/process`, { method: 'POST', body: formData })
        .then(r => { if (!r.ok) throw new Error(`Server error ${r.status}`); return r.json(); }),
      animDone,
    ]);
    state.results = apiData.results;
    state.anchor  = apiData.anchor || null;
    state.files   = [];
    Object.keys(redactChoices).forEach(k => delete redactChoices[k]);

    // If a case was selected, link each new document to it
    if (state.selectedCaseId && apiData.results) {
      for (const doc of apiData.results) {
        if (doc.id) {
          await authFetch(`${API_BASE}/api/cases/${state.selectedCaseId}/documents`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ document_id: doc.id }),
          }).catch(()=>{});
        }
      }
      // Refresh the case list silently
      loadCasesData().catch(()=>{});
    }

    go('results');
  } catch (err) {
    state.processingError = err.message.includes('fetch')
      ? 'Cannot reach backend. Is it running? Run: uvicorn main:app --reload inside TFN/backend/'
      : err.message;
    go('upload');
  }
}

/* Load live stats + history from backend. Silently falls back to empty if offline. */
async function loadDashboardData() {
  try {
    const [statsRes, histRes] = await Promise.all([
      authFetch(`${API_BASE}/api/documents/stats`),
      authFetch(`${API_BASE}/api/documents/history?limit=5`),
    ]);
    if (!statsRes.ok || !histRes.ok) return;
    const stats       = await statsRes.json();
    const { documents } = await histRes.json();

    state.stats   = stats;
    state.history = documents.map(d => ({
      name:   d.filename,
      docs:   1,
      status: d.tfn_count > 0 ? 'review' : 'done',
      tfns:   d.tfn_count,
      time:   timeAgo(d.created_at),
      data:   d,
    }));

    if (state.page === 'dashboard') render();
  } catch (_) { /* backend not running yet — show empty state */ }
}

/* Load profile data from backend. */
async function loadProfileData() {
  try {
    const res = await fetch(`${API_BASE}/api/users/me`);
    if (!res.ok) return;
    state.profile = await res.json();
    if (state.page === 'profile') render();
  } catch (_) {}
}

function timeAgo(dateStr) {
  const diff = Date.now() - new Date(dateStr + (dateStr.includes('Z') ? '' : 'Z')).getTime();
  const m = Math.floor(diff / 60000);
  if (m < 1)  return 'just now';
  if (m < 60) return `${m} min${m > 1 ? 's' : ''} ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h} hr${h > 1 ? 's' : ''} ago`;
  return `${Math.floor(h / 24)} day${Math.floor(h / 24) > 1 ? 's' : ''} ago`;
}

/* ─────────────────────────────────────────────
   REDACTION STATE
   Key: "docIndex_tfnIndex" → true (redact) / false (keep)
───────────────────────────────────────────── */
const redactChoices = {};   // populated on first results render

function initRedactChoices(docs) {
  docs.forEach((doc, di) => {
    doc.tfns.forEach((_, ti) => {
      const key = `${di}_${ti}`;
      if (!(key in redactChoices)) redactChoices[key] = true; // default: redact
    });
  });
}

function toggleRedact(di, ti) {
  const key = `${di}_${ti}`;
  redactChoices[key] = !redactChoices[key];
  // Re-render only the TFN chip row without full page reload
  const chip = document.getElementById(`tfn_${di}_${ti}`);
  if (chip) {
    const will = redactChoices[key];
    chip.className = `inline-flex items-center gap-2 border rounded-lg px-3 py-2 mr-2 mb-2 transition-all ${will ? 'bg-red-50 border-red-200' : 'bg-gray-50 border-gray-200'}`;

      label.textContent = will ? 'Redact' : 'Keep';
      label.className = `redact-label text-xs font-semibold px-2 py-0.5 rounded-md transition-all ${will ? 'bg-red-100 text-red-700 hover:bg-red-200' : 'bg-gray-200 text-gray-600 hover:bg-gray-300'}`;
    }
    const num = chip.querySelector('.tfn-num');
    if (num) num.className = `tfn-chip text-sm font-mono font-bold ${will ? 'text-red-800' : 'text-gray-500 line-through'}`;
  }
  // Update sidebar count
  const countEl = document.getElementById('redactCount');
  if (countEl) {
    const n = Object.values(redactChoices).filter(Boolean).length;
    countEl.textContent = n;
  }
}

function setAllRedact(di, value) {
  Object.keys(redactChoices).forEach(key => {
    if (key.startsWith(`${di}_`)) redactChoices[key] = value;
  });
  render(); // full re-render to update all chips at once
}

async function confirmRedaction() {
  const docs = (state.results || []).map(r => ({
    id:   r.id,
    name: r.filename,
    tfns: r.tfns || [],
  }));

  const toRedact = docs.map((doc, di) => ({
    doc_id: doc.id,
    filename: doc.name,
    redact_tfns: doc.tfns
      .filter((_, ti) => redactChoices[`${di}_${ti}`] !== false)
      .map(t => t.normalized),
  })).filter(d => d.redact_tfns.length > 0);

  if (toRedact.length === 0) {
    alert('No TFNs selected for redaction. Toggle at least one to "Redact" first.');
    return;
  }

  const btn = document.querySelector('button[onclick="confirmRedaction()"]');
  if (btn) {
    btn.textContent = 'Generating redacted PDF…';
    btn.disabled = true;
    btn.className = btn.className.replace('bg-red-600 hover:bg-red-700', 'bg-gray-400 cursor-not-allowed');
  }

  try {
    // Download each document's redacted PDF
    for (const item of toRedact) {
      const resp = await authFetch(`${API_BASE}/api/documents/${item.doc_id}/redact`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ redact_tfns: item.redact_tfns }),
      });

      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        throw new Error(err.detail || `Server error ${resp.status}`);
      }

      // Trigger browser download
      const blob = await resp.blob();
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      const stem = item.filename.replace(/\.[^.]+$/, '');
      a.href     = url;
      a.download = `${stem}_redacted.pdf`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    if (btn) {
      btn.textContent = 'Redacted PDF downloaded';
      btn.className = btn.className.replace('bg-gray-400 cursor-not-allowed', 'bg-emerald-600');
      btn.disabled = false;
    }
  } catch (err) {
    if (btn) {
      btn.textContent = 'Confirm Redaction';
      btn.disabled = false;
      btn.className = btn.className.replace('bg-gray-400 cursor-not-allowed', 'bg-red-600 hover:bg-red-700');
    }
    alert('Redaction failed: ' + err.message);
  }
}

/* ─────────────────────────────────────────────

───────────────────────────────────────────── */
function handleFileSelect(e) {
  addFiles([...e.target.files]);
}
function handleDragOver(e) {
  e.preventDefault();
  document.getElementById('dropZone').classList.add('drag-over');
}
function handleDragLeave(e) {
  document.getElementById('dropZone').classList.remove('drag-over');
}
function handleDrop(e) {
  e.preventDefault();
  document.getElementById('dropZone').classList.remove('drag-over');
  const ALLOWED = ['application/pdf','image/jpeg','image/png','image/tiff','image/bmp','image/webp','image/gif'];
  const files = [...e.dataTransfer.files].filter(f=>ALLOWED.includes(f.type)||f.name.match(/\.(pdf|jpe?g|png|tiff?|bmp|webp)$/i));
  if (files.length) addFiles(files);
}
function addFiles(newFiles) {
  const existing = new Set(state.files.map(f=>f.name));
  newFiles.forEach(f => {
    if (!existing.has(f.name)) state.files.push(f); // keep actual File objects
  });
  render();
}
function removeFile(i) {
  state.files.splice(i,1);
  render();
}

/* ─────────────────────────────────────────────

───────────────────────────────────────────── */
function toggleEditInfo() {
  const view = document.getElementById('infoView');
  const edit = document.getElementById('infoEdit');
  const btn  = document.getElementById('editInfoBtn');
  if (view.classList.contains('hidden')) {
    view.classList.remove('hidden');
    edit.classList.add('hidden');
    btn.textContent = 'Edit';
  } else {
    view.classList.add('hidden');
    edit.classList.remove('hidden');
    btn.innerHTML = `<svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>Cancel`;
  }
}

const prefStates = [true, true, true, false];
function togglePref(i) {
  prefStates[i] = !prefStates[i];
  const btn = document.getElementById(`pref_${i}`);
  const dot = document.getElementById(`prefDot_${i}`);
  if (prefStates[i]) {
    btn.className = btn.className.replace('bg-gray-200','bg-indigo-600');
    dot.className = dot.className.replace('translate-x-0.5','translate-x-5');
  } else {
    btn.className = btn.className.replace('bg-indigo-600','bg-gray-200');
    dot.className = dot.className.replace('translate-x-5','translate-x-0.5');
  }
}

              <div class="mt-2 flex flex-wrap gap-1.5">
                ${doc.names.map(n=>`<span class="text-xs bg-blue-50 text-blue-700 px-2.5 py-1 rounded-full font-medium">${n}</span>`).join('')}
              </div>
            ` : ''}

            ${comp ? `
              <div class="mt-3 pt-3 border-t border-gray-100 text-xs text-gray-500">
                Name match vs anchor: <strong class="text-${flag==='green'?'emerald':flag==='yellow'?'amber':'red'}-600">${comp.best_match_name||'—'} (${comp.best_score}%)</strong>
                ${comp.reason ? `· ${comp.reason}` : ''}
              </div>
            ` : ''}
          </div>
        `;}).join('')}
      </div>

      <!-- Sidebar -->
      <div class="space-y-5">

        <!-- Anchor Analysis -->
        ${anchor ? `
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 slide-in">
          <h3 class="font-bold text-gray-900 mb-4 flex items-center gap-2">
            <svg class="w-4 h-4 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
            </svg>
            Identity Anchor
          </h3>
          <div class="p-3 bg-purple-50 rounded-xl mb-3">
            <p class="text-xs text-purple-600 font-semibold mb-0.5">★ ${anchor.anchor_filename}</p>
            <p class="text-xs text-purple-500">${anchor.anchor_doc_type}</p>
            ${anchor.anchor_name ? `<p class="text-xs text-purple-700 font-bold mt-1">${anchor.anchor_name}</p>` : ''}
          </div>
          <div class="space-y-2">
            ${anchor.comparisons.map(c=>`
              <div class="flex items-center justify-between text-xs">
                <span class="text-gray-600 truncate max-w-[130px]">${c.filename}</span>
                <span class="tier-badge ${flagClass(c.flag)} ml-2 flex-shrink-0">${c.flag.toUpperCase()} ${c.best_score}%</span>
              </div>
            `).join('')}
          </div>
        </div>
        ` : ''}

        <!-- Quick actions -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 slide-in">
          <h3 class="font-bold text-gray-900 mb-4">Quick Actions</h3>
          <div class="space-y-2.5">
            <button onclick="go('upload')"
              class="w-full text-left px-4 py-3 border border-indigo-200 bg-indigo-50 rounded-xl text-sm font-semibold text-indigo-700 hover:bg-indigo-100 transition-colors">
              + Upload More Documents
            </button>
            <button onclick="downloadCaseReport(${c.id})"
              class="w-full text-left px-4 py-3 border border-gray-200 rounded-xl text-sm font-semibold text-gray-700 hover:bg-gray-50 transition-colors flex items-center gap-2">
              <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
              </svg>
              Download Unified Report
            </button>
            <button onclick="deleteCase(${c.id})"
              class="w-full text-left px-4 py-3 border border-red-200 rounded-xl text-sm font-semibold text-red-600 hover:bg-red-50 transition-colors">
              Delete Case
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>`;
}

/* ─────────────────────────────────────────────
   CASE FUNCTIONS
───────────────────────────────────────────── */
async function loadCasesData() {
  try {
    const res = await authFetch(`${API_BASE}/api/cases/list`);
    if (!res.ok) return;
    const data = await res.json();
    state.cases = data.cases || [];
    if (state.page === 'cases' || state.page === 'upload') render();
  } catch (_) {}
}

async function loadCaseDetail(caseId) {
  if (!caseId) return;
  try {
    const res = await authFetch(`${API_BASE}/api/cases/${caseId}`);
    if (!res.ok) return;
    state.currentCase = await res.json();
    if (state.page === 'caseDetail') render();
  } catch (_) {}
}

function showNewCaseModal() {
  const m = document.getElementById('newCaseModal');
  if (m) { m.classList.remove('hidden'); document.getElementById('newCaseName')?.focus(); }
}

function hideNewCaseModal() {
  const m = document.getElementById('newCaseModal');
  if (m) m.classList.add('hidden');
  const e = document.getElementById('newCaseError');
  if (e) e.classList.add('hidden');
}

async function createNewCase() {
  const nameEl = document.getElementById('newCaseName');
  const errEl  = document.getElementById('newCaseError');
  const name   = nameEl?.value?.trim();

  if (errEl) errEl.classList.add('hidden');
  if (!name) {
    if (errEl) { errEl.textContent = 'Please enter a client name.'; errEl.classList.remove('hidden'); }
    return;
  }

  try {
    const res = await authFetch(`${API_BASE}/api/cases/create`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ client_name: name }),
    });
    if (!res.ok) throw new Error((await res.json()).detail || `Error ${res.status}`);
    const { case: newCase } = await res.json();

    state.cases = [newCase, ...(state.cases || [])];
    hideNewCaseModal();
    // Open the new case immediately into the dashboard
    state.activeCase     = newCase;
    state.selectedCaseId = String(newCase.id);
    go('dashboard');
  } catch (err) {
    if (errEl) { errEl.textContent = err.message; errEl.classList.remove('hidden'); }
  }
}

async function openCase(caseId) {
  const found = (state.cases || []).find(c => c.id === caseId);
  state.activeCase     = found || { id: caseId, client_name: '…' };
  state.selectedCaseId = String(caseId);
  go('dashboard');
}

async function downloadCaseReport(caseId) {
  const btn = document.getElementById(`reportBtn_${caseId}`);
  if (btn) { btn.textContent = 'Generating…'; btn.disabled = true; }

  try {
    const res = await authFetch(`${API_BASE}/api/cases/${caseId}/report`);
    if (!res.ok) throw new Error((await res.json().catch(()=>({}))).detail || `Error ${res.status}`);

    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = `case_${caseId}_report.pdf`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    alert('Report download failed: ' + err.message);
  } finally {
    if (btn) {
      btn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg> Download Report`;
      btn.disabled = false;
    }
  }
}

async function deleteCase(caseId) {
  if (!confirm('Delete this case? The documents themselves will not be deleted.')) return;
  try {
    const res = await authFetch(`${API_BASE}/api/cases/${caseId}`, { method: 'DELETE' });
    if (!res.ok) throw new Error((await res.json()).detail || `Error ${res.status}`);
    state.cases = (state.cases||[]).filter(c => c.id !== caseId);
    if (state.page === 'caseDetail') go('cases');
    else render();
  } catch (err) {
    alert('Delete failed: ' + err.message);
  }
}

/* ─────────────────────────────────────────────
   RENDER
───────────────────────────────────────────── */
const screenMap = {
  home:       homeScreen,
  login:      loginScreen,
  dashboard:  dashboardScreen,
  upload:     uploadScreen,
  processing: processingScreen,
  results:    resultsScreen,
  profile:    profileScreen,
  cases:      casesScreen,
  caseDetail: caseDetailScreen,
};

function render() {
  document.getElementById('app').innerHTML = (screenMap[state.page] || dashboardScreen)();
}

/* ─────────────────────────────────────────────
   AUTH
───────────────────────────────────────────── */
async function authFetch(url, opts = {}) {
  const { data: { session } } = await sb.auth.getSession();
  const headers = { ...(opts.headers || {}) };
  if (session) headers['Authorization'] = `Bearer ${session.access_token}`;
  return fetch(url, { ...opts, headers });
}

async function signInWithGoogle() {
  await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + window.location.pathname },
  });
}

function togglePasswordVisibility() {
  const input = document.getElementById('loginPassword');
  const icon  = document.getElementById('eyeIcon');
  if (!input) return;
  if (input.type === 'password') {
    input.type = 'text';
    icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>`;
  } else {
    input.type = 'password';
    icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>`;
  }
}

async function submitEmailAuth() {
  const email    = document.getElementById('loginEmail')?.value?.trim();
  const password = document.getElementById('loginPassword')?.value;
  const name     = document.getElementById('signupName')?.value?.trim();
  const errorEl   = document.getElementById('loginError');
  const successEl = document.getElementById('loginSuccess');
  errorEl.classList.add('hidden');
  successEl.classList.add('hidden');
  if (!email || !password) {
    errorEl.textContent = 'Please enter your email and password.';
    errorEl.classList.remove('hidden');
    return;
  }
  if (_loginView === 'signup') {
    const { error } = await sb.auth.signUp({
      email, password,
      options: { data: { full_name: name || email.split('@')[0] } }
    });
    if (error) {
      errorEl.textContent = error.message === 'Failed to fetch'
        ? 'Authentication service unreachable. Your Supabase project may be paused — resume it at supabase.com/dashboard.'
        : error.message;
      errorEl.classList.remove('hidden');
    } else {
      successEl.textContent = 'Account created! You can now sign in.';
      successEl.classList.remove('hidden');
      setTimeout(() => { _loginView = 'signin'; render(); }, 1500);
    }
  } else {
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      errorEl.textContent = error.message === 'Failed to fetch'
        ? 'Authentication service unreachable. Your Supabase project may be paused — resume it at supabase.com/dashboard.'
        : error.message;
      errorEl.classList.remove('hidden');
    }
  }
}

async function sendPasswordReset() {
  const email   = document.getElementById('forgotEmail')?.value?.trim();
  const errorEl = document.getElementById('forgotError');
  const successEl = document.getElementById('forgotSuccess');
  errorEl.classList.add('hidden');
  successEl.classList.add('hidden');
  if (!email) {
    errorEl.textContent = 'Please enter your email address.';
    errorEl.classList.remove('hidden');
    return;
  }
  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + window.location.pathname,
  });
  if (error) {
    errorEl.textContent = error.message;
    errorEl.classList.remove('hidden');
  } else {
    successEl.textContent = 'Reset link sent! Check your inbox (and spam folder).';
    successEl.classList.remove('hidden');
  }
}

async function signOut() {
  await sb.auth.signOut();
  state.user = null;
  state.session = null;
  go('home');
}


// ── Listen for auth state changes (login, logout, token refresh) ──────────────
sb.auth.onAuthStateChange((event, session) => {
  state.session = session;
  state.user    = session?.user ?? null;
  if (event === 'SIGNED_IN')  go('cases');
  if (event === 'SIGNED_OUT') { state.activeCase = null; state.page = 'home'; render(); }
});

// ── On load: restore existing session then render ─────────────────────────────
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  state.session = session;
  state.user    = session?.user ?? null;
  if (session && state.page === 'home') state.page = 'cases';
  render();
  if (state.page === 'cases')     loadCasesData();
  if (state.page === 'dashboard') loadDashboardData();
})();
</script>
