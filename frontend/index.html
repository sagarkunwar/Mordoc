const PROTECTED = ['dashboard','upload','processing','results','profile'];

function go(page, data={}) {
  if (PROTECTED.includes(page) && !state.user) {
    state.page = 'login';
    render();
    return;
  }
  Object.assign(state, data);
  state.page = page;
  render();
  if (page === 'dashboard') loadDashboardData();
  if (page === 'profile')   loadProfileData();
}

function fmtSize(b) {
  if (b < 1024) return b+'B';
  if (b < 1048576) return (b/1024).toFixed(1)+'KB';
  return (b/1048576).toFixed(1)+'MB';
}
function badge(type) {
  const map = {
    done:    'bg-emerald-100 text-emerald-700',
    review:  'bg-amber-100   text-amber-700',
    error:   'bg-red-100     text-red-700',
    pending: 'bg-gray-100    text-gray-600',
  };
  const labels = { done:'✓ Done', review:'⚠ Review', error:'✗ Error', pending:'— Pending' };
  return `<span class="px-3 py-1 rounded-full text-xs font-semibold ${map[type]||map.pending}">${labels[type]||type}</span>`;
}
function initials(name) {
  return name.split(' ').slice(0,2).map(n=>n[0]).join('');
}

function scrollTo(id) {
  setTimeout(() => {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior:'smooth', block:'start' });
  }, 50);
}

function toggleFaq(i) {
  const body  = document.getElementById(`faqBody_${i}`);
  const arrow = document.getElementById(`faqArrow_${i}`);
  const open  = !body.classList.contains('hidden');
  body.classList.toggle('hidden', open);
  arrow.style.transform = open ? '' : 'rotate(180deg)';
}

/* Returns a Promise that resolves when the animation finishes. */
function startProcessing() {
  stepsDone = 0;
  const total    = processingSteps.length;
  const interval = 600;

  return new Promise(resolve => {
    function tick() {
      if (stepsDone >= total) { setTimeout(resolve, 400); return; }

      const icon = document.getElementById(`stepIcon_${stepsDone}`);
      const text = document.getElementById(`stepText_${stepsDone}`);
      const bar  = document.getElementById('progBar');

      if (icon) icon.className = 'w-7 h-7 rounded-full flex items-center justify-center flex-shrink-0 step-icon-active transition-all';
      if (text) text.className = 'text-sm text-indigo-700 font-medium';

      setTimeout(() => {
        if (icon) {
          icon.className = 'w-7 h-7 rounded-full flex items-center justify-center flex-shrink-0 step-icon-done transition-all';
          icon.innerHTML = `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>`;
        }
        stepsDone++;
        if (bar) bar.style.width = Math.round((stepsDone / total) * 100) + '%';
        tick();
      }, interval);
    }
    setTimeout(tick, 400);
  });
}

/* Called when user clicks Process. Runs animation + API call in parallel. */
async function processFiles() {
  state.processingError = null;
  state.page = 'processing';
  render();

  const animDone = startProcessing();

  const formData = new FormData();
  state.files.forEach(f => formData.append('files', f));

  try {
    const [apiData] = await Promise.all([
      authFetch(`${API_BASE}/api/documents/process`, { method: 'POST', body: formData })
        .then(r => { if (!r.ok) throw new Error(`Server error ${r.status}`); return r.json(); }),
      animDone,
    ]);
    state.results = apiData.results;
    state.files   = [];  // clear queue after processing
    go('results');
  } catch (err) {
    state.processingError = err.message.includes('fetch')
      ? 'Cannot reach backend. Is it running? Run: uvicorn main:app --reload inside TFN/backend/'
      : err.message;
    go('upload');
  }
}

/* Load live stats + history from backend. Silently falls back to empty if offline. */
async function loadDashboardData() {
  try {
    const [statsRes, histRes] = await Promise.all([
      authFetch(`${API_BASE}/api/documents/stats`),
      authFetch(`${API_BASE}/api/documents/history?limit=5`),
    ]);
    if (!statsRes.ok || !histRes.ok) return;
    const stats       = await statsRes.json();
    const { documents } = await histRes.json();

    state.stats   = stats;
    state.history = documents.map(d => ({
      name:   d.filename,
      docs:   1,
      status: d.tfn_count > 0 ? 'review' : 'done',
      tfns:   d.tfn_count,
      time:   timeAgo(d.created_at),
      data:   d,
    }));

    if (state.page === 'dashboard') render();
  } catch (_) { /* backend not running yet — show empty state */ }
}

/* Load profile data from backend. */
async function loadProfileData() {
  try {
    const res = await fetch(`${API_BASE}/api/users/me`);
    if (!res.ok) return;
    state.profile = await res.json();
    if (state.page === 'profile') render();
  } catch (_) {}
}

function timeAgo(dateStr) {
  const diff = Date.now() - new Date(dateStr + (dateStr.includes('Z') ? '' : 'Z')).getTime();
  const m = Math.floor(diff / 60000);
  if (m < 1)  return 'just now';
  if (m < 60) return `${m} min${m > 1 ? 's' : ''} ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h} hr${h > 1 ? 's' : ''} ago`;
  return `${Math.floor(h / 24)} day${Math.floor(h / 24) > 1 ? 's' : ''} ago`;
}

/* ─────────────────────────────────────────────
   FILE HANDLING
───────────────────────────────────────────── */
function handleFileSelect(e) {
  addFiles([...e.target.files]);
}
function handleDragOver(e) {
  e.preventDefault();
  document.getElementById('dropZone').classList.add('drag-over');
}
function handleDragLeave(e) {
  document.getElementById('dropZone').classList.remove('drag-over');
}
function handleDrop(e) {
  e.preventDefault();
  document.getElementById('dropZone').classList.remove('drag-over');
  const ALLOWED = ['application/pdf','image/jpeg','image/png','image/tiff','image/bmp','image/webp','image/gif'];
  const files = [...e.dataTransfer.files].filter(f=>ALLOWED.includes(f.type)||f.name.match(/\.(pdf|jpe?g|png|tiff?|bmp|webp)$/i));
  if (files.length) addFiles(files);
}
function addFiles(newFiles) {
  const existing = new Set(state.files.map(f=>f.name));
  newFiles.forEach(f => {
    if (!existing.has(f.name)) state.files.push(f); // keep actual File objects
  });
  render();
}
function removeFile(i) {
  state.files.splice(i,1);
  render();
}

/* ─────────────────────────────────────────────

───────────────────────────────────────────── */
async function authFetch(url, opts = {}) {
  const { data: { session } } = await sb.auth.getSession();
  const headers = { ...(opts.headers || {}) };
  if (session) headers['Authorization'] = `Bearer ${session.access_token}`;
  return fetch(url, { ...opts, headers });
}

async function signInWithGoogle() {
  await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + window.location.pathname },
  });
}

let _authTab = 'signin';

function setAuthTab(tab) {
  _authTab = tab;
  const si = document.getElementById('tabSignIn');
  const su = document.getElementById('tabSignUp');
  const btn = document.getElementById('authSubmitBtn');
  if (tab === 'signin') {
    si.className = si.className.replace('bg-white text-gray-600','bg-indigo-600 text-white');
    su.className = su.className.replace('bg-indigo-600 text-white','bg-white text-gray-600');
    btn.textContent = 'Sign In';
  } else {
    su.className = su.className.replace('bg-white text-gray-600','bg-indigo-600 text-white');
    si.className = si.className.replace('bg-indigo-600 text-white','bg-white text-gray-600');
    btn.textContent = 'Create Account';
  }
  document.getElementById('loginError')?.classList.add('hidden');
  document.getElementById('loginSuccess')?.classList.add('hidden');
}

async function submitEmailAuth() {
  const email    = document.getElementById('loginEmail')?.value?.trim();
  const password = document.getElementById('loginPassword')?.value;
  const errorEl  = document.getElementById('loginError');
  const successEl = document.getElementById('loginSuccess');
  errorEl.classList.add('hidden');
  successEl.classList.add('hidden');
  if (!email || !password) {
    errorEl.textContent = 'Please enter your email and password.';
    errorEl.classList.remove('hidden');
    return;
  }
  if (_authTab === 'signup') {
    const { error } = await sb.auth.signUp({ email, password });
    if (error) {
      errorEl.textContent = error.message;
      errorEl.classList.remove('hidden');
    } else {
      successEl.textContent = 'Account created! Check your email to confirm, then sign in.';
      successEl.classList.remove('hidden');
    }
  } else {
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      errorEl.textContent = error.message;
      errorEl.classList.remove('hidden');
    }
  }
}

async function signOut() {
  await sb.auth.signOut();
  state.user = null;
  state.session = null;
  go('home');
}

function toggleEmailForm() {
  document.getElementById('emailForm')?.classList.toggle('hidden');
}

// ── Listen for auth state changes (login, logout, token refresh) ──────────────
sb.auth.onAuthStateChange((event, session) => {
  state.session = session;
  state.user    = session?.user ?? null;
  if (event === 'SIGNED_IN')  go('dashboard');
  if (event === 'SIGNED_OUT') { state.page = 'home'; render(); }
});

// ── On load: restore existing session then render ─────────────────────────────
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  state.session = session;
  state.user    = session?.user ?? null;
  if (session && state.page === 'home') state.page = 'dashboard';
  render();
  if (state.page === 'dashboard') loadDashboardData();
})();
</script>
